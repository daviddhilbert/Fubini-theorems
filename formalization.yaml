fidelity:
  divergences: >-
    The exported theorem explicitly retains a canonical tagged RV structure,
    ACVF(0,0), an uncountable saturation bound, strong homogeneity, a small
    VF-generated real ground and a small nontrivial Gamma subgroup containing
    the real ground's RV values. Source objects have finite RV fibres over
    VF tuples; their VF coordinates need not be valuatively bounded. At each
    mixed-base point, actual definable bijections to RV lifts and equality in
    the same parameter-relative RES ring are required. No simplification to
    arbitrary fibre integrals is claimed. RV inversion is named and totalized
    at the single absorbing RV zero, following the provider's language correction.
    Mathlib's multiplicative valuation order reverses the paper's additive order.
