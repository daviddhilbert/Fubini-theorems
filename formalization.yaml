version: "v0.4"
project:
  name: "Bounded Fubini in algebraically closed valued fields"
  description: >-
    A Lean formalization of Forey and Yin's Theorem 5.17. For two definable
    maps to a common mixed VF/RV base, parameter-definable RV lifts of every
    pair of fibres with equal bounded residue-field evaluations imply equal
    bounded invariants of the total VF classes. The saturated canonical
    equicharacteristic-zero model and small generated-ground hypotheses are
    explicit. The submission selection contains this one theorem; necessary definition helpers may accompany its vocabulary.
  authors: ["Yimu Yin"]
  responsible_maintainers: ["Yimu Yin"]
  license: "MIT"
classification:
  arxiv: ["math.LO", "math.AG"]
  msc2020: ["03C60", "12J25", "14E18", "03B35"]
sources:
  - title: "Bounded integral and motivic Milnor fiber"
    authors: ["Arthur Forey", "Yimu Yin"]
    id: "arXiv:1910.12764v2"
    location: "https://arxiv.org/abs/1910.12764v2"
    type: paper
    relationship: formalizes
    note: >-
      Theorem 5.17 in Section 5.2, using its explicit RV-lift hypothesis.
      The selected result concerns the unmeasured integral followed by bounded
      Euler reduction. The later measured bounded integral and Milnor-fibre
      applications are not this submission's claim.
